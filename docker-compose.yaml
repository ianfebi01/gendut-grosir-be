services:
  app:
    image: ghcr.io/ianfebi01/gendut-grosir-be:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - proxy
      - backend

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data_3:/data/db
    # Healthy once the root user from .env can log in over the network, so the app
    # never starts against a Mongo that is still initialising (the first-boot setup
    # instance only listens on localhost, which connecting via $(hostname) skips).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host "$$(hostname)"
          -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

volumes:
  mongo_data_3:

networks:
  proxy:
    external: true
  backend:
